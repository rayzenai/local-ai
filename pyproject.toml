[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rayzen-local-ai"
version = "0.1.0"
description = "A memory-conscious local image, speech, and voice LoRA API for Windows and NVIDIA GPUs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "RayzenAI" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.34,<2",
  "psutil>=6,<8",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
local-ai = "local_ai.cli:main"

[project.urls]
Repository = "https://github.com/rayzenai/local-ai"
Issues = "https://github.com/rayzenai/local-ai/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
